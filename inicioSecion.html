          />

      </div>
    </header>

    <!-- Barra de navegación -->
    <nav class="barra-menu">
      <ul>
        <li><a href="PaginaPrincipal.php">Inicio</a></li>

        <a href="Contacto.html">Contactos</a>
        <div class="inscriccion separador"></div>
        <a href="Evento.php">Eventos</a>
      </ul>
    </nav>

    <!-- Formulario de inicio de sesión -->
    <section class="formulario-evento">
      <h2 class="titulo-formulario">Iniciar Sesión</h2>
      <form id="loginForm" class="form-evento">
        <label for="usuario">Usuario:</label>
        <input
          type="text"
          id="usuario"
          name="usuario"
          required
          placeholder="Nombre de usuario"
        />

        <label for="contrasena">Contraseña:</label>
        <input
          type="password"
          id="contrasena"
          name="contrasena"
          required
          placeholder="Contraseña"
        />

        <input type="submit" value="Iniciar Sesión" />
        <div id="errorMensaje" style="color: red; margin-top: 10px"></div>
      </form>
    </section>

    <!-- Pie de pagina Footer-->
    <footer class="footer">
      <div class="overlay"></div>
      <div class="footer-content">
        <p class="frase">Museo Municipal De El Pogreso, Yoro</p>
        <img
          src="Imagenes/Encabezado/LogoMuni.png"
          alt="Escudo de El Progreso"
          class="escudo"
        />
        <p class="copy">
          © Copyright 2025 Museo Municipal De El Progreso, Yoro. Todos los
          derechos reservados.
        </p>
      </div>
    </footer>

    <script>
      document
        .getElementById("loginForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();

          // Limpiar mensajes y bordes previos
          document.getElementById("errorMensaje").textContent = "";
          document.getElementById("usuario").style.borderColor = "";
          document.getElementById("contrasena").style.borderColor = "";

          const usuario = document.getElementById("usuario").value.trim();
          const contrasena = document.getElementById("contrasena").value.trim();

          if (!usuario || !contrasena) {
            if (!usuario)
              document.getElementById("usuario").style.borderColor = "red";
            if (!contrasena)
              document.getElementById("contrasena").style.borderColor = "red";
            document.getElementById("errorMensaje").textContent =
              "Por favor llena todos los campos.";
            return;
          }

          const data = new FormData();
          data.append("usuario", usuario);
          data.append("contrasena", contrasena);

          fetch("PHP/login.php", {
            method: "POST",
            body: data,
          })
            .then((response) => response.json())
            .then((res) => {
              if (res.exito) {
                window.location.href = res.redireccion;
              } else {
                document.getElementById("errorMensaje").textContent =
                  res.mensaje;
                if (res.errorCampo === "usuario") {
                  document.getElementById("usuario").style.borderColor = "red";
                } else if (res.errorCampo === "contrasena") {
                  document.getElementById("contrasena").style.borderColor =
                    "red";
                }
              }
            })
            .catch((err) => {
              console.error("Error en la petición:", err);
            });
        });
    </script>
  </body>
</html>
